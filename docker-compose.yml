# BEYU OS — local development stack.
#
# Brings up the real backing services (PostgreSQL, Redis, Kafka, MinIO) so the
# application runs against production-shaped infrastructure rather than
# in-process substitutes.
#
# NOT a production deployment. Credentials here are development defaults and
# are deliberately obvious; production uses infrastructure/kubernetes with
# secrets supplied by the platform's secret manager.
#
#   docker compose up -d
#   pnpm db:migrate && pnpm db:seed

name: beyu-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: beyu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beyu
      POSTGRES_PASSWORD: beyu_dev_password
      POSTGRES_DB: beyu_os
      # Deterministic collation so ORDER BY matches across machines.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beyu -d beyu_os']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: beyu-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka in KRaft mode — no ZooKeeper.
  kafka:
    image: bitnami/kafka:3.7
    container_name: beyu-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    ports:
      - '9092:9092'
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 20

  # S3-compatible object storage for documents.
  minio:
    image: minio/minio:latest
    container_name: beyu-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: beyu_dev
      MINIO_ROOT_PASSWORD: beyu_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 20

  # Creates the documents bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: beyu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 beyu_dev beyu_dev_password &&
      mc mb --ignore-existing local/beyu-os-documents &&
      mc version enable local/beyu-os-documents &&
      echo 'BEYU OS document bucket ready'
      "

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
